# The Daily Pulse — local / production stack (MySQL 8.4 + Redis + API + web).
# Run from infrastructure/docker:  docker compose up -d --build
# Environment is read from the repository-root .env file (see .env.example).
# The build context for api/web is the repository root so the shared
# package (packages/shared) is available during `npm ci` and the build.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-<redacted>}
      MYSQL_DATABASE: ${DB_NAME:-daily_pulse}
      MYSQL_USER: ${DB_USER:-daily_pulse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-<redacted>}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-<redacted>}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-daily_pulse}
      DB_USER: ${DB_USER:-daily_pulse}
      DB_PASSWORD: ${DB_PASSWORD:-<redacted>}
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
